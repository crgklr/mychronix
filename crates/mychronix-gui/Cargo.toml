[package]
name = "mychronix-gui"
description = "Download and analyze AiM MyChron kart data"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
reqwest.workspace = true
aim-xrk.workspace = true
eframe.workspace = true
egui_plot.workspace = true
rfd.workspace = true
image.workspace = true
fastframe-text.workspace = true
fastframe-fonts.workspace = true
fastframe-icons.workspace = true
egui_extras.workspace = true
jiff = "0.2"
flate2 = "1"
walkers.workspace = true
aim-track.workspace = true
serde.workspace = true
serde_json.workspace = true
aim-link.workspace = true
trash = "5.2.9"

# Linux packages, built by .github/workflows/release.yml (cargo-deb and
# cargo-generate-rpm). Icons are rendered from the SVG into target/icons first.
# Telling GNOME Mychronix has started (src/startup_notify.rs); winit already uses these.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[package.metadata.deb]
name = "mychronix"
maintainer = "Mychronix contributors"
copyright = "Mychronix contributors"
extended-description = "Download sessions from AiM MyChron kart data loggers (over WiFi, or a MyChron 4 data key), analyze laps and browse tracks. Independent project, not affiliated with AiM."
section = "utils"
depends = "$auto"
recommends = "network-manager"
assets = [
    ["target/release/mychronix-gui", "usr/bin/", "755"],
    ["target/release/mychronix", "usr/bin/", "755"],
    ["../../packaging/linux/mychronix.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/70-mychronix-aim.rules", "usr/lib/udev/rules.d/", "644"],
    ["assets/mychronix-icon.svg", "usr/share/icons/hicolor/scalable/apps/mychronix.svg", "644"],
    ["../../target/icons/48x48/mychronix.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../target/icons/128x128/mychronix.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../target/icons/256x256/mychronix.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../target/icons/512x512/mychronix.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["../../README.md", "usr/share/doc/mychronix/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/mychronix/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/mychronix/", "644"],
]

[package.metadata.generate-rpm]
name = "mychronix"
summary = "Download and analyze AiM MyChron kart data"
assets = [
    { source = "target/release/mychronix-gui", dest = "/usr/bin/mychronix-gui", mode = "755" },
    { source = "target/release/mychronix", dest = "/usr/bin/mychronix", mode = "755" },
    { source = "packaging/linux/mychronix.desktop", dest = "/usr/share/applications/mychronix.desktop", mode = "644" },
    { source = "packaging/linux/70-mychronix-aim.rules", dest = "/usr/lib/udev/rules.d/70-mychronix-aim.rules", mode = "644" },
    { source = "crates/mychronix-gui/assets/mychronix-icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/mychronix.svg", mode = "644" },
    { source = "target/icons/48x48/mychronix.png", dest = "/usr/share/icons/hicolor/48x48/apps/mychronix.png", mode = "644" },
    { source = "target/icons/128x128/mychronix.png", dest = "/usr/share/icons/hicolor/128x128/apps/mychronix.png", mode = "644" },
    { source = "target/icons/256x256/mychronix.png", dest = "/usr/share/icons/hicolor/256x256/apps/mychronix.png", mode = "644" },
    { source = "target/icons/512x512/mychronix.png", dest = "/usr/share/icons/hicolor/512x512/apps/mychronix.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mychronix/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/mychronix/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/mychronix/LICENSE-APACHE", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
NetworkManager = "*"
