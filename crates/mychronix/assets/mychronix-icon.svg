<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Mychronix icon: a minimal MyChron 6</title>
  <!-- Body, outlined in black so the icon holds its edge on any background -->
  <rect x="3" y="9" width="58" height="46" rx="11" fill="#2d333c" stroke="#000" stroke-width="3"/>
  <!-- Shift lights -->
  <g fill="#6e7784">
    <circle cx="22" cy="16" r="1.9"/>
    <circle cx="27.33" cy="16" r="1.9"/>
    <circle cx="32.67" cy="16" r="1.9"/>
    <circle cx="38" cy="16" r="1.9"/>
    <circle cx="43.33" cy="16" r="1.9"/>
  </g>
  <circle cx="16.67" cy="16" r="1.9" fill="#34c759"/>
  <circle cx="48.67" cy="16" r="1.9" fill="#e66767"/>
  <!-- Cyan LCD with its bezel -->
  <rect x="9" y="22" width="46" height="27" rx="4" fill="#19d3f2" stroke="#000" stroke-width="2"/>
  <!-- Screen layout: a divided top row over the lap time -->
  <g fill="#06252c">
    <rect x="13" y="34.6" width="38" height="1.6" rx="0.8"/>
    <rect x="31.2" y="25.5" width="1.6" height="8" rx="0.8"/>
    <rect x="14" y="27.5" width="12" height="4" rx="1.5"/>
    <rect x="36" y="27.5" width="13" height="4" rx="1.5"/>
    <rect x="16" y="39" width="32" height="6.5" rx="2"/>
  </g>
</svg>
