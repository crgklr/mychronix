# Builds the downloads: Linux (AppImage, .deb, .rpm, tarball) and Mac
# (Apple Silicon .dmg).
#
# - Push a tag like v0.1.0: builds them, attaches them to a GitHub Release,
#   then publishes it to the dnf/apt repositories and Homebrew (publish.yml).
# - Run it by hand (Actions → Release → Run workflow): builds them as
#   downloadable artifacts on the run, without making a release.
#
# Linux is built on Ubuntu 22.04 so the programs also run on distros a few
# years old (a program built against an older glibc runs on newer ones, not
# the reverse).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxkbcommon-dev libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install packagers
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: scripts/package-linux.sh

      - uses: actions/upload-artifact@v5
        with:
          name: mychronix-linux-x86_64
          path: target/dist/*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install librsvg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Package
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@v5
        with:
          name: mychronix-macos-arm64
          path: target/dist/*

  # One job makes the release, once both builds are done.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Mychronix ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Then out to the package repositories and Homebrew.
  publish:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
