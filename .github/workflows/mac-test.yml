# A quick Mac-only build for testing: push to the `mac-test` branch (or run
# it by hand) and the Apple Silicon .dmg appears as a downloadable artifact
# on the run. Nothing is released. Tests are left to the Release workflow,
# to keep this quick.
name: Mac test build

on:
  push:
    branches: [mac-test]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install build tools
        run: brew install librsvg

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Package
        run: scripts/package-macos.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mychronix-macos-arm64-test
          path: target/dist/*
          retention-days: 7
