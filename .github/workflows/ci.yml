# Formatting, tests, screenshots, clippy, docs and known security advisories on every push and pull request, so a change that breaks
# something is caught before a release tag (release.yml tests again then).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev pkg-config \
            xvfb xauth libgl1-mesa-dri libegl1 libgl1 libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      # Each page on the made-up library against its reference image (see
      # crates/mychronix/tests/screens.rs; scripts/screens/run.sh runs it the same way locally).
      - name: Screenshots
        run: xvfb-run -a -s "-screen 0 2560x1600x24" cargo test --locked -p mychronix --test screens -- --nocapture
        env:
          MYCHRONIX_SCREEN_TESTS: 1

      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: target/tmp/screens/*.png
          if-no-files-found: ignore

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Dependencies with a published security advisory (RustSec) fail the build.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      - name: Security advisories
        run: cargo audit
